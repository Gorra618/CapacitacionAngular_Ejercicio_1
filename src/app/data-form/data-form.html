<h1>Lista de tareas</h1>

<form
  class="row row-cols-lg-auto g-3 align-items-center"
  [formGroup]="taskForm"
  (ngSubmit)="guardarTarea()"
>
  <div class="col-12">
    <label>Crear nueva tarea</label>
    <div class="input-group">
      <input
        class="form-control"
        type="text"
        placeholder="Ingresar nueva tarea"
        formControlName="tarea"
      />
    </div>
  </div>

  <div class="col-12">
    <label>Prioridad</label>
    <select formControlName="prioridad" class="form-select" id="inlineFormSelectPref">
      <option value="">Seleccionar prioridad</option>
      <option value="Alta">Alta</option>
      <option value="Media">Media</option>
      <option value="Baja">Baja</option>
    </select>
  </div>

  <div class="row g-3">
    <div class="col-auto">
      <button type="submit" [disabled]="taskForm.invalid" class="btn btn-success">Enviar</button>
    </div>
    <div>
      <button (click)="clearTasks($event)" class="btn btn-danger">Limpiar lista</button>
    </div>
  </div>
</form>

<div>
  <ul>
    @for (item of lista; track item.tarea) {
      <li>{{ item.tarea }} [ {{ item.prioridad }} ] <button class="btn btn-danger">Eliminar</button></li>
    }
  </ul>
</div>

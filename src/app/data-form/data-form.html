<div class="container mt-5">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h1 class="mb-4">Lista de tareas</h1>

      <form [formGroup]="taskForm" (ngSubmit)="guardarTarea()" class="mb-4">
        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Nueva tarea</label>
          <div class="col-sm-9">
            <input
              class="form-control"
              type="text"
              placeholder="Ingresar nueva tarea"
              formControlName="tarea"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-3 col-form-label">Prioridad</label>
          <div class="col-sm-9">
            <select formControlName="prioridad" class="form-select">
              <option value="">Seleccionar prioridad</option>
              <option value="Alta">Alta</option>
              <option value="Media">Media</option>
              <option value="Baja">Baja</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-9 offset-sm-3">
            <button type="submit" [disabled]="taskForm.invalid" class="btn btn-success me-2">
              Enviar
            </button>
            <button type="button" (click)="clearList($event)" class="btn btn-danger">
              Limpiar lista
            </button>
          </div>
        </div>
      </form>

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Tareas</h5>
          <ul class="list-group list-group-flush">
            @for (item of lista; track item.tarea) {
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ item.tarea }} <span class="badge bg-info ms-2">{{ item.prioridad }}</span></span>
                <button class="btn btn-sm btn-danger" (click)="deleteTask($event, $index)">
                  Eliminar
                </button>
              </li>
            }
            @empty {
              <li class="list-group-item text-muted">No hay tareas</li>
            }
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
